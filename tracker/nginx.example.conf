# AeroPrompter tracker — nginx snippet for the aeroprompter.app site
#
# Paste into the site's nginx config in Forge:
#   Forge → aeroprompter.app → Edit Files → Edit Nginx Configuration
# inside the existing `server { ... }` block that already has the TLS config,
# then Forge will reload nginx for you.
#
# Both locations use `=` (exact match). In nginx an exact-match location wins
# over any prefix location, so these cannot be shadowed by an existing
# `location /api/` or `location /` rule further down the file.

# --- Visitor beacon: public, same-origin ------------------------------------
location = /api/hit {
    proxy_pass http://127.0.0.1:8787/hit;

    proxy_set_header Host              $host;
    # The tracker hashes this to identify visitors; it must be the real client
    # address, so set it here rather than trusting anything from the browser.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Beacons are fire-and-forget; never let one hang a browser connection.
    proxy_connect_timeout 2s;
    proxy_read_timeout    5s;

    access_log off;
}

# --- Stats dashboard: private ------------------------------------------------
location = /stats {
    auth_basic           "AeroPrompter stats";
    auth_basic_user_file /etc/nginx/aeroprompter-stats.htpasswd;

    proxy_pass http://127.0.0.1:8787/dashboard;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Optional: health check, handy while setting things up. Delete once happy.
location = /api/hit-health {
    proxy_pass http://127.0.0.1:8787/health;
    access_log off;
}
